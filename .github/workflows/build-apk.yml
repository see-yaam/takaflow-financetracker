name: Build & Package Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TakaFlow Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rnzofkinmetxedimdbdv.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__RjLCxU1wzKVxL1ucoW8hg_ZMHhuYRz' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'rnzofkinmetxedimdbdv' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          if ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log; then
            echo "### ✅ Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          else
            BUILD_STATUS=${PIPESTATUS[0]}
            echo "### ❌ Gradle Build Failed (Exit code: $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo "<details open><summary><b>Click to view last 100 lines of Gradle Build Log</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 ../gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          fi

      - name: Rename APK for User Download
        if: success()
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TakaFlow.apk
          ls -lh TakaFlow.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload TakaFlow APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TakaFlow-Android-App
          path: TakaFlow.apk
          retention-days: 30
