name: Build & Package Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TakaFlow Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rnzofkinmetxedimdbdv.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__RjLCxU1wzKVxL1ucoW8hg_ZMHhuYRz' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'rnzofkinmetxedimdbdv' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- Platforms ---"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms dir"
          echo "--- Build Tools ---"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools dir"
          echo "--- CMake ---"
          ls $ANDROID_HOME/cmake/ 2>/dev/null || echo "no cmake"

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 3

      - name: Upload TakaFlow APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TakaFlow-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
