name: Build & Package Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-apk:
    name: Build TakaFlow Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rnzofkinmetxedimdbdv.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__RjLCxU1wzKVxL1ucoW8hg_ZMHhuYRz' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'rnzofkinmetxedimdbdv' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install web dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Rename APK for User Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TakaFlow.apk
          ls -lh TakaFlow.apk

      - name: 📤 Upload TakaFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakaFlow-Android-App
          path: TakaFlow.apk
          retention-days: 30
