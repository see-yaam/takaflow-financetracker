name: Build & Package Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TakaFlow Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rnzofkinmetxedimdbdv.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__RjLCxU1wzKVxL1ucoW8hg_ZMHhuYRz' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'rnzofkinmetxedimdbdv' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install platform 36
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" 2>/dev/null || true

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Report Build Error on Failure
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILURE:|What went wrong:|Caused by:|error:)" -A 1 gradle-build.log | head -n 25 | while IFS= read -r line; do
            echo "::error title=Gradle Error::$line"
          done || true

      - name: Locate and Package APK
        if: success()
        run: |
          echo "Listing all built APK files:"
          find android/ -name "*.apk" -ls
          APK_PATH=$(find android/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in android/ directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" TakaFlow.apk
          ls -lh TakaFlow.apk
          echo "### 📱 TakaFlow Android APK Ready!" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and packaged \`TakaFlow.apk\`." >> $GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload TakaFlow APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TakaFlow-Android-App
          path: TakaFlow.apk
          retention-days: 30
